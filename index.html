<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airplane Dodge Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="high-score">High Score: 0</div>
            <div class="main-buttons">
                <button id="start-btn">Start Game</button>
                <button id="partner-btn">Partnership</button>
            </div>
            <button id="theme-toggle">Dark Mode</button>
        </div>

        <!-- Partnership Modal -->
        <div id="contact-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Partnership Inquiry</h2>
                <form action="https://formspree.io/f/mvzbwaqn" method="POST">
                    <input type="hidden" name="_subject" value="New Partnership Inquiry">
                    <div class="form-group">
                        <label for="email">Your Email:</label>
                        <input type="email" id="email" name="email" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Inquiry Details:</label>
                        <textarea id="message" name="message" required placeholder="Enter your partnership inquiry here..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Inquiry</button>
                </form>
            </div>
        </div>
        <div id="joystick-container">
            <div id="joystick-handle"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="main.js"></script>
</body>
</html>
